<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon"  type="image/png" href="flower.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        table {
            border: 2px solid black;
            background-color: azure;
            text-align: center;
            width: 900px;
            height: 400px;
            margin: 50px auto;
            border-collapse: collapse;
        }

        th {
            font-size: 30px;
            font-weight: bold;
            background-color: bisque;
        }

        tr,
        th,
        td {
            border: 2px solid black;
            font-size: 20px;
            font-weight: bold;
        }

        .name {
            text-align: left;
            padding-left: 5px;
        }

        .mark {
            text-align: right;
            padding-right: 5px;
        }
    </style>
</head>

<body>
    <table>
        <tr class="heading">
            <th rowspan="2">No</th>
            <th rowspan="2">Student Name</th>
            <th rowspan="2">Gender</th>
            <th rowspan="2">Roll No.</th>
            <th colspan="3">Mark</th>

        </tr>
        <tr>
            <th>Myanmar</th>
            <th>English</th>
            <th>Marks</th>
        </tr>
        <tr>
            <td>1</td>
            <td class="name">Su Su</td>
            <td rowspan="2">Female</td>
            <td class="name">5C-32</td>
            <td class="mark">60</td>
            <td class="mark">75</td>
            <td class="mark">86</td>
        </tr>
        <tr>
            <td>2</td>
            <td class="name">Moe Moe</td>
            <td class="name">5C-33</td>
            <td class="mark">78</td>
            <td class="mark">86</td>
            <td class="mark">84</td>
        </tr>
        <tr>
            <td>3</td>
            <td class="name">Kyaw Kyaw</td>
            <td rowspan="3">Male</td>
            <td class="name">5C-34</td>
            <td class="mark">89</td>
            <td class="mark">43</td>
            <td class="mark">86</td>
        </tr>
        <tr>
            <td>4</td>
            <td class="name">Mg Mg</td>
            <td class="name">5C-35</td>
            <td class="mark">76</td>
            <td class="mark">75</td>
            <td class="mark">75</td>
        </tr>
        <tr>
            <td>5</td>
            <td class="name">Aung Aung</td>
            <td class="name">5C-36</td>
            <td class="mark">87</td>
            <td class="mark">75</td>
            <td class="mark">86</td>
        </tr>
    </table>
</body>

</html>
