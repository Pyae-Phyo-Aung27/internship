<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: rgb(214, 237, 244);
      }

      .container {
        background-color: white;
        width: 300px;
        margin: 50px auto;
        height: 550px;
        border-radius: 20px;
      }

      /* .result {
            text-align: end;
            margin-right: 20px;
            padding-top: 30px;
            font-size: 40px;
        } */
      .result {
        border: none;
        outline: none;
        width: 300px;
        text-align: end;
        border-radius: 20px;
        padding-right: 20px;
        padding-top: 20px;
        font-size: 40px;
      }

      .btn-div {
        margin: 130px 20px 0 20px;
      }

      .btn-row {
        display: flex;
        justify-content: space-between;
      }

      .btn {
        background-color: rgb(204, 204, 230);
        width: 58px;
        height: 58px;
        border-radius: 100%;
        border: none;
        margin-bottom: 10px;
      }
      #clear,
      #delete,
      #equal,
      #divid,
      #multi,
      #adda,
      #minus {
        color: rgb(244, 96, 96);
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <!--result-->
    <div class="container">
      <!-- <p class="result" id="finalresult">0|</p> -->
      <input type="text" id="finalresult" value="" class="result" />

      <!--Button-->
      <div class="btn-div">
        <div class="btn-row">
          <button class="btn" id="clear" value="clear">C</button>
          <button class="btn" id="delete" value="delete">&#9003;</button>
          <button class="btn" id="mod" value="mod">%</button>
          <button class="btn" id="divid" value="divid">÷</button>
        </div>
        <div class="btn-row">
          <button class="btn">7</button>
          <button class="btn">8</button>
          <button class="btn">9</button>
          <button class="btn" id="multi">×</button>
        </div>
        <div class="btn-row">
          <button class="btn">4</button>
          <button class="btn">5</button>
          <button class="btn">6</button>
          <button class="btn" id="minus">-</button>
        </div>
        <div class="btn-row">
          <button class="btn">1</button>
          <button class="btn">2</button>
          <button class="btn">3</button>
          <button class="btn" id="adda">+</button>
        </div>
        <div class="btn-row">
          <button class="btn">( )</button>
          <button class="btn">0</button>
          <button class="btn">.</button>
          <button class="btn" id="equal">=</button>
        </div>
      </div>
    </div>
    <script>
      let result = document.getElementById("finalresult");

      let expression = "";

      result.value = "0";
      // allow cursor
      result.removeAttribute("readonly");

      // block keyboard typing
      result.addEventListener("keydown", (e) => {
        e.preventDefault();
      });

      document.querySelectorAll(".btn").forEach((button) => {
        button.addEventListener("click", () => {
          let value = button.textContent.trim();

          result.focus();

          let start = result.selectionStart || expression.length;
          let end = result.selectionEnd || expression.length;

          let operators = ["+", "-", "×", "÷"];

          // CLEAR
          if (value === "C") {
            expression = "";
            result.value = "0";
          }

          // DELETE
          else if (value === "⌫") {
            if (expression.length > 0 && start > 0) {
              expression =
                expression.slice(0, start - 1) + expression.slice(end);

              result.value = expression || "0";

              let newPos = start - 1;

              setTimeout(() => {
                result.setSelectionRange(newPos, newPos);
              });
            }
          }

          // EQUAL
          else if (value === "=") {
            try {
              if (expression.trim() === "") {
                result.value = "0";
                return;
              }

              let lastChar = expression[expression.length - 1];

              let invalidOperators = ["+", "-", "×", "÷", "."];

              if (invalidOperators.includes(lastChar)) {
                result.value = "Error";
                return;
              }

              // convert symbols
              let fixedExpression = expression
                .replace(/×/g, "*")
                .replace(/÷/g, "/")
                .replace(/(\d+)%/g, "($1/100)");

              let answer = eval(fixedExpression);

              expression = answer.toString();

              result.value = expression;
            } catch (error) {
              result.value = "Error";
              expression = "";
            }
          }

          // BRACKETS
          else if (value === "( )") {
            let openCount = (expression.match(/\(/g) || []).length;
            let closeCount = (expression.match(/\)/g) || []).length;

            let beforeCursor = expression[start - 1];

            let insertValue = "";

            // OPEN BRACKET
            if (
              expression === "" ||
              operators.includes(beforeCursor) ||
              beforeCursor === "("
            ) {
              insertValue = "(";
            }

            // AUTO MULTIPLY BEFORE (
            else if (
              /\d/.test(beforeCursor) ||
              beforeCursor === ")" ||
              beforeCursor === "%"
            ) {
              if (openCount === closeCount) {
                insertValue = "*(";
              } else {
                insertValue = ")";
              }
            }

            // CLOSE BRACKET
            else if (openCount > closeCount) {
              insertValue = ")";
            } else {
              insertValue = "(";
            }

            expression =
              expression.slice(0, start) + insertValue + expression.slice(end);

            result.value = expression;

            let newPos = start + insertValue.length;

            setTimeout(() => {
              result.setSelectionRange(newPos, newPos);
            });
          }
          // NORMAL BUTTONS
          else {
            let beforeCursor = expression[start - 1];

            // prevent double operators
            if (operators.includes(value) && operators.includes(beforeCursor)) {
              return;
            }

            // prevent starting with operator
            if (expression === "" && operators.includes(value)) {
              return;
            }

            // prevent multiple %
            if (value === "%" && beforeCursor === "%") {
              return;
            }

            // prevent multiple dots in same number
            if (value === ".") {
              let leftPart = expression.slice(0, start);

              let currentNumber = leftPart.split(/[+\-×÷%()]/).pop();

              // prevent 1.2.3
              if (currentNumber.includes(".")) {
                return;
              }

              // auto add 0 before .
              if (
                start === 0 ||
                operators.includes(beforeCursor) ||
                beforeCursor === "("
              ) {
                value = "0.";
              }
            }

            // remove default zero
            if (expression === "0") {
              expression = "";
            }

            expression =
              expression.slice(0, start) + value + expression.slice(end);

            result.value = expression;

            let newPos = start + value.length;

            setTimeout(() => {
              result.setSelectionRange(newPos, newPos);
            });
          }
        });
      });
    </script>
  </body>
</html>
