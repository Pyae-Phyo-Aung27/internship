<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: rgb(214, 237, 244);
      }

      .container {
        background-color: white;
        width: 300px;
        margin: 50px auto;
        height: 550px;
        border-radius: 20px;
      }

      /* .result {
            text-align: end;
            margin-right: 20px;
            padding-top: 30px;
            font-size: 40px;
        } */
      .result {
        border: none;
        outline: none;

        width: 300px;
        text-align: end;
        border-radius: 20px;
        padding-right: 20px;
        font-size: 40px;
      }

      .btn-div {
        margin: 100px 20px 0 20px;
      }

      .btn-row {
        display: flex;
        justify-content: space-between;
      }

      .btn {
        background-color: rgb(204, 204, 230);
        width: 58px;
        height: 58px;
        border-radius: 100%;
        border: none;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <!--result-->
    <div class="container">
      <!-- <p class="result" id="finalresult">0|</p> -->
      <input type="text" id="finalresult" value="0" class="result" />

      <!--Button-->
      <div class="btn-div">
        <div class="btn-row">
          <button class="btn" id="clear" value="clear">C</button>
          <button class="btn" id="delete" value="delete">Del</button>
          <button class="btn" id="mod" value="mod">%</button>
          <button class="btn" id="divid" value="divid">/</button>
        </div>
        <div class="btn-row">
          <button class="btn">7</button>
          <button class="btn">8</button>
          <button class="btn">9</button>
          <button class="btn">*</button>
        </div>
        <div class="btn-row">
          <button class="btn">4</button>
          <button class="btn">5</button>
          <button class="btn">6</button>
          <button class="btn">-</button>
        </div>
        <div class="btn-row">
          <button class="btn">1</button>
          <button class="btn">2</button>
          <button class="btn">3</button>
          <button class="btn">+</button>
        </div>
        <div class="btn-row">
          <button class="btn">( )</button>
          <button class="btn">0</button>
          <button class="btn">.</button>
          <button class="btn">=</button>
        </div>
      </div>
    </div>

    <script>
      let result = document.getElementById("finalresult");

      let expression = "";

      result.focus();

      document.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => {
          let value = button.textContent;

          // Clear
          if (value === "C") {
            expression = "";
            result.value = "0";
          }

          // Delete
          else if (value === "Del") {
            expression = expression.slice(0, -1);

            result.value = expression || "0";
          }

          // Result
          else if (value === "=") {
            try {
              expression = eval(expression).toString();

              result.value = expression;
            } catch {
              result.value = "Error";

              expression = "";
            }
          }

          // Buttons
          else {
            if (expression === "0") {
              expression = "";
            }

            expression += value;

            result.value = expression;
          }

          result.focus();
        });
      });
    </script>
  </body>
</html>
