<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body>
    <main class="bg-gray-600 p-4 grid sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
        <div class="bg-white p-4 rounded-lg">
            <span class="bg-gray-400 p-2 rounded-lg">📊</span>
            <h1 class="font-extrabold">2.4K</h1>
            <p class="text-xa text-gray-600">Page Views</p>
        </div>
        <div class="bg-white p-4 rounded-lg">
            <span class="bg-gray-400 p-2 rounded-lg">📈</span>
            <h1 class="font-extrabold">$8.2K</h1>
            <p class="text-xa text-gray-600">Revenue</p>
        </div>
        <div class="bg-white p-4 rounded-lg">
            <span class="bg-gray-400 p-2 rounded-lg">🧟‍♂️</span>
            <h1 class="font-extrabold">892</h1>
            <p class="text-xa text-gray-600">New Users</p>
        </div>
        <div class="bg-white p-4 rounded-lg">
            <span class="bg-gray-400 p-2 rounded-lg">★</span>
            <h1 class="font-extrabold">4.9</h1>
            <p class="text-xa text-gray-600">Rating</p>
        </div>
    </main>
</body>
</html>
