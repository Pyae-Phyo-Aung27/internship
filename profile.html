<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div
      class="bg-blue-300 w-[250px] mx-auto flex flex-col justify-center p-4 mt-8 gap-4 rounded-lg"
    >
      <!--Image-->
      <div class="flex justify-center">
        <img class="w-20" src="image.png" alt="profile" />
      </div>

      <!--Name-->
      <div class="text-center">
        <p class="text-xl font-bold text-white">Jane Developer</p>
        <p class="text-sm">Full-Stack Engineer!</p>
      </div>

      <!--Language-->
      <div class="flex justify-between">
        <p class="bg-red-200 rounded-lg px-2">React</p>
        <p class="bg-green-200 rounded-lg px-2">Tailwind</p>
        <p class="bg-yellow-200 rounded-md px-2">Node.js</p>
      </div>
 
      <!--Button-->
      <button class="bg-blue-500 text-white rounded-lg">Follow</button>
    </div>
  </body>
</html>
